
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password | CBT School</title>

  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/auth.css" />
  <link rel="stylesheet" href="./css/layout.css" />
  <link rel="stylesheet" href="./css/forms.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <link rel="stylesheet" href="./css/responsive.css" />
  <link
    href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css"
    rel="stylesheet"
  />
</head>
<body>
  <main class="auth-main">
    <section class="auth-card">
      <header class="auth-header">
        <h2>Forgot Password?</h2>
        <p>
          Enter your registered school-owner email address.
          If your account exists, we'll send you a password reset link.
        </p>
      </header>

      <div
        class="form-alert"
        id="formAlert"
        role="alert"
        aria-live="polite"
        hidden
      ></div>

      <form id="forgotPasswordForm" class="auth-form" novalidate>
        <div class="form-group">
          <label for="email">Email Address <span>*</span></label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="principal@yourschool.edu.ng"
            autocomplete="email"
            required
          />
          <small class="input-error"></small>
        </div>

        <button type="submit" class="btn btn-primary auth-submit">
          <span class="btn-text">Send Reset Link</span>
          <i class="ri-arrow-right-line"></i>
          <span class="btn-loader" hidden></span>
        </button>
      </form>

      <footer class="auth-footer">
        <p>
          Remembered your password?
          <a href="./login.html">Back to login</a>
        </p>
      </footer>
    </section>
  </main>

  <script src="../backend/api.js"></script>
  <script src="../backend/forgotPassword.js"></script>
</body>
</html>
