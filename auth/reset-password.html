
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password | CBT School</title>

  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/auth.css" />
  <link rel="stylesheet" href="./css/layout.css" />
  <link rel="stylesheet" href="./css/forms.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <link rel="stylesheet" href="./css/responsive.css" />
  <link
    href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css"
    rel="stylesheet"
  />
</head>
<body>
  <main class="auth-main">
    <section class="auth-card">
      <header class="auth-header">
        <h2>Reset Your Password</h2>
        <p>Create a new password for your school account.</p>
      </header>

      <div
        class="form-alert"
        id="formAlert"
        role="alert"
        aria-live="polite"
        hidden
      ></div>

      <form id="resetPasswordForm" class="auth-form" novalidate>
        <div class="form-group">
          <label for="email">Registered Email</label>
          <input
            type="email"
            id="email"
            name="email"
            autocomplete="email"
            readonly
            required
          />
        </div>

        <div class="form-group">
          <label for="newPassword">New Password <span>*</span></label>
          <div class="password-field">
            <input
              type="password"
              id="newPassword"
              name="newPassword"
              placeholder="At least 8 characters"
              autocomplete="new-password"
              minlength="8"
              maxlength="128"
              required
            />
            <button
              type="button"
              class="password-toggle"
              data-target="newPassword"
              aria-label="Show new password"
            >
              <i class="ri-eye-line"></i>
            </button>
          </div>
          <small class="input-error"></small>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm New Password <span>*</span></label>
          <div class="password-field">
            <input
              type="password"
              id="confirmPassword"
              name="confirmPassword"
              placeholder="Enter the password again"
              autocomplete="new-password"
              required
            />
            <button
              type="button"
              class="password-toggle"
              data-target="confirmPassword"
              aria-label="Show confirmed password"
            >
              <i class="ri-eye-line"></i>
            </button>
          </div>
          <small class="input-error"></small>
        </div>

        <button type="submit" class="btn btn-primary auth-submit">
          <span class="btn-text">Reset Password</span>
          <i class="ri-arrow-right-line"></i>
          <span class="btn-loader" hidden></span>
        </button>
      </form>

      <footer class="auth-footer">
        <p><a href="./login.html">Back to login</a></p>
      </footer>
    </section>
  </main>

  <script src="../backend/api.js"></script>
  <script src="../backend/resetPassword.js"></script>
</body>
</html>
