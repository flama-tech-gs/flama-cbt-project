<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot Admin Password</title>
  <style>
    body { font: 16px Inter, system-ui, -apple-system, "Segoe UI", sans-serif; background: #f8faf8; margin: 0; padding: 32px 16px; color: #202124; }
    main { max-width: 520px; margin: auto; background: white; padding: 28px; border: 1px solid #dde5dd; border-radius: 16px; box-shadow: 0 16px 40px rgba(35,70,37,.09); }
    form { display: grid; gap: 14px; }
    label { display: grid; gap: 6px; font-weight: 600; }
    input, button { box-sizing: border-box; width: 100%; padding: 11px; border: 1px solid #cbd8cc; border-radius: 9px; font: inherit; }
    input:focus { outline: 2px solid rgba(46,125,50,.18); border-color: #2e7d32; }
    button { background: #2e7d32; border: 0; color: white; font-weight: 700; cursor: pointer; }
    button:hover { background: #256628; }
    button:disabled { opacity: .6; }
    #formMessage { display: none; margin: 14px 0; padding: 12px; background: #eaf6ea; color: #256628; border-radius: 9px; white-space: pre-wrap; }
    #formMessage.error { background: #fef3f2; color: #b42318; }
    a { color: #3b2f8f; }
  </style>
    <script src="../../backend/adminAuth.js" defer></script>
</head>
<body>
  <main>
    <h1>Forgot password</h1>
    <p>Enter your admin email to receive password reset instructions.</p>
    <div id="formMessage" role="status"></div>

    <form id="forgotPasswordForm">
      <label>Email
        <input name="email" type="email" required>
      </label>
      <button type="submit">Send reset instructions</button>
    </form>

    <p><a href="./admin-reset-password">I already have a reset token</a></p>
    <p><a href="./admin-verify">Verify email</a></p>
  </main>
</body>
</html>
