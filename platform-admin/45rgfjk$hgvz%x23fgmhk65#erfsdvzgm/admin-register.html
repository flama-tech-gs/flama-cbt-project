<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Invite Admin</title>
  <style>
    body { font: 16px Inter, system-ui, -apple-system, "Segoe UI", sans-serif; background: #f8faf8; margin: 0; padding: 32px 16px; color: #202124; }
    main { max-width: 520px; margin: auto; background: white; padding: 28px; border: 1px solid #dde5dd; border-radius: 16px; box-shadow: 0 16px 40px rgba(35,70,37,.09); }
    form { display: grid; gap: 14px; }
    label { display: grid; gap: 6px; font-weight: 600; }
    input, select, button { box-sizing: border-box; width: 100%; padding: 11px; border: 1px solid #cbd8cc; border-radius: 9px; font: inherit; }
    input:focus, select:focus { outline: 2px solid rgba(46,125,50,.18); border-color: #2e7d32; }
    button { background: #2e7d32; border: 0; color: white; font-weight: 700; cursor: pointer; }
    button:hover { background: #256628; }
    button:disabled { opacity: .6; }
    #formMessage { display: none; margin: 14px 0; padding: 12px; background: #eaf6ea; color: #256628; border-radius: 9px; white-space: pre-wrap; }
    #formMessage.error { background: #fef3f2; color: #b42318; }
    a { color: #3b2f8f; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  </style>
  <script src="../../backend/adminAuth.js" defer></script>
</head>
<body>
  <main>
    <h1>Invite an administrator</h1>
    <p>A Super Admin must be logged in to send an invitation.</p>
    <div id="formMessage" role="status"></div>

    <form id="createAdminForm">
      <div class="row">
        <label>First name
          <input name="firstName" required minlength="2" maxlength="50">
        </label>
        <label>Last name
          <input name="lastName" required minlength="2" maxlength="50">
        </label>
      </div>

      <label>Email
        <input name="email" type="email" required>
      </label>

      <label>Phone
        <input name="phone" type="tel" maxlength="30">
      </label>

      <label>Temporary password
        <input name="password" type="password" required minlength="6" maxlength="128">
      </label>

      <label>Role
        <select name="roleName" required>
          <option value="SUPPORT_ADMIN">Support Admin</option>
          <option value="BILLING_ADMIN">Billing Admin</option>
        </select>
      </label>

      <button type="submit">Invite administrator</button>
    </form>

    <p><a href="./admin-verify">Verify an admin email</a></p>
  </main>
</body>
</html>
