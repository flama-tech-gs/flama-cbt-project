<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Invite Admin</title>
  <style>
    body { font: 16px Arial, sans-serif; background: #f4f6f8; margin: 0; padding: 32px 16px; color: #1c2430; }
    main { max-width: 520px; margin: auto; background: white; padding: 28px; border-radius: 12px; }
    form { display: grid; gap: 14px; }
    label { display: grid; gap: 6px; font-weight: 600; }
    input, select, button { box-sizing: border-box; width: 100%; padding: 11px; border: 1px solid #ccd3dd; border-radius: 7px; font: inherit; }
    button { background: #2457d6; border: 0; color: white; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .6; }
    #formMessage { display: none; margin: 14px 0; padding: 12px; background: #eef3ff; border-radius: 7px; white-space: pre-wrap; }
    #formMessage.error { background: #fff0f0; color: #9d2020; }
    a { color: #2457d6; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  </style>
  <script src="../../backend/adminAuth.js" defer></script>
</head>
<body>
  <main>
    <h1>Invite an administrator</h1>
    <p>A Super Admin must be logged in to send an invitation.</p>
    <div id="formMessage" role="status"></div>

    <form id="createAdminForm">
      <div class="row">
        <label>First name
          <input name="firstName" required minlength="2" maxlength="50">
        </label>
        <label>Last name
          <input name="lastName" required minlength="2" maxlength="50">
        </label>
      </div>

      <label>Email
        <input name="email" type="email" required>
      </label>

      <label>Phone
        <input name="phone" type="tel" maxlength="30">
      </label>

      <label>Temporary password
        <input name="password" type="password" required minlength="6" maxlength="128">
      </label>

      <label>Role
        <select name="roleName" required>
          <option value="SUPPORT_ADMIN">Support Admin</option>
          <option value="BILLING_ADMIN">Billing Admin</option>
        </select>
      </label>

      <button type="submit">Invite administrator</button>
    </form>

    <p><a href="./admin-verify.html">Verify an admin email</a></p>
  </main>
</body>
</html>
