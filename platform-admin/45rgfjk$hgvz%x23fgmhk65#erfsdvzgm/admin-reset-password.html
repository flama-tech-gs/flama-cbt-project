<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Admin Password</title>
  <style>
    body { font: 16px Arial, sans-serif; background: #f4f6f8; margin: 0; padding: 32px 16px; color: #1c2430; }
    main { max-width: 520px; margin: auto; background: white; padding: 28px; border-radius: 12px; }
    form { display: grid; gap: 14px; }
    label { display: grid; gap: 6px; font-weight: 600; }
    input, button { box-sizing: border-box; width: 100%; padding: 11px; border: 1px solid #ccd3dd; border-radius: 7px; font: inherit; }
    button { background: #2457d6; border: 0; color: white; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .6; }
    #formMessage { display: none; margin: 14px 0; padding: 12px; background: #eef3ff; border-radius: 7px; white-space: pre-wrap; }
    #formMessage.error { background: #fff0f0; color: #9d2020; }
    a { color: #2457d6; }
  </style>
    <script src="../../backend/adminAuth.js" defer></script>
</head>
<body>
  <main>
    <h1>Reset password</h1>
    <p>Paste the reset token from your email and choose a new password.</p>
    <div id="formMessage" role="status"></div>

    <form id="resetPasswordForm">
      <label>Reset token
        <input name="token" id="resetToken" required>
      </label>
      <label>New password
        <input name="newPassword" type="password" required minlength="6" maxlength="128">
      </label>
      <button type="submit">Reset password</button>
    </form>

    <p><a href="./admin-forgot-password.html">Request another reset email</a></p>
  </main>
</body>
</html>
