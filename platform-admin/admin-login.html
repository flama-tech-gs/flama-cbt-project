<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flama Admin Sign In</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#111827;background:#f4f6fb}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at top left,#e6e8ff,transparent 40%),#f4f6fb}
main{width:100%;max-width:430px}.brand{display:flex;justify-content:center;align-items:center;gap:12px;margin-bottom:22px}.mark{display:grid;place-items:center;width:44px;height:44px;border-radius:13px;background:#4f46e5;color:#fff;font-weight:800;font-size:22px}.brand strong{font-size:24px;letter-spacing:-1px}.brand small{display:block;color:#667085;font-size:12px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:32px;box-shadow:0 20px 60px #10182812}h1{margin:0 0 7px;font-size:27px;letter-spacing:-1px}.intro{margin:0 0 25px;color:#667085;font-size:14px}
.field{margin-bottom:18px}label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}input[type=email],input[type=password],input[type=text]{width:100%;height:47px;border:1px solid #d0d5dd;border-radius:10px;padding:11px 13px;font:inherit;font-size:14px;outline:none}input:focus{border-color:#4f46e5;box-shadow:0 0 0 3px #4f46e51c}.password{position:relative}.password input{padding-right:68px}.toggle{position:absolute;right:10px;top:50%;transform:translateY(-50%);border:0;background:none;color:#4f46e5;font-weight:700;cursor:pointer}
.options{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 22px}.remember{display:flex;align-items:center;gap:8px;font-weight:500;color:#475467}.remember input{accent-color:#4f46e5}.forgot{font-size:13px;font-weight:700;color:#4f46e5;text-decoration:none}
button.submit{width:100%;height:48px;border:0;border-radius:10px;background:#4f46e5;color:#fff;font:inherit;font-size:14px;font-weight:750;cursor:pointer}button.submit:hover{background:#4338ca}button.submit:disabled{opacity:.65;cursor:wait}.alert{padding:11px 12px;margin-bottom:16px;border-radius:9px;font-size:13px}.alert[hidden]{display:none}.error{color:#b42318;background:#fef3f2;border:1px solid #fecdca}.success{color:#067647;background:#ecfdf3;border:1px solid #abefc6}.foot{text-align:center;color:#667085;font-size:12px;margin-top:20px}
@media(max-width:480px){.card{padding:25px 21px}h1{font-size:24px}}
</style>
</head>
<body>
<main>
  <div class="brand"><div class="mark">F</div><div><strong>Flama</strong><small>Platform administration</small></div></div>
  <section class="card">
    <h1>Admin sign in</h1>
    <p class="intro">Sign in with your administrator account to manage the Flama platform.</p>
    <div id="formAlert" class="alert" role="alert" aria-live="polite" hidden></div>
    <form id="adminLoginForm">
      <div class="field"><label for="email">Admin email</label><input id="email" name="email" type="email" autocomplete="username" placeholder="you@company.com" required></div>
      <div class="field"><label for="password">Password</label><div class="password"><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required><button class="toggle" id="togglePassword" type="button">Show</button></div></div>
      <div class="options"><label class="remember" for="remember"><input id="remember" type="checkbox"> Remember me</label><a class="forgot" href="./admin-forgot-password.html">Forgot password?</a></div>
      <button class="submit" id="submitButton" type="submit"><span id="buttonText">Sign in to admin</span></button>
    </form>
  </section>
  <p class="foot">Authorized Flama administrators only.</p>
</main>
<script src="../backend/adminLogin.js"></script>
</body>
</html>
