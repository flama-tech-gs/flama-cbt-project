<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Available Exams | Student Portal</title>

    <link rel="stylesheet" href="../css/pages/exam-start.css" />
      <script src="../../backend/portalAccessGuard.js"></script>
</head>

  <body>
    <!-- TOP RIGHT USER -->
    <div class="top-right">
      <img id="studentAvatar" src="../assets/icons/avatar.png" alt="Student profile" />
      <div>
        <h4 id="topStudentName">Loading student…</h4>
        <p id="topStudentClass">Loading class…</p>
        <p id="topStudentRole">Student</p>
      </div>
    </div>

    <!-- BACK BUTTON -->
    <button class="back-btn">←</button>

    <!-- EXAM CARD -->
    <main class="exam-container">
      <h1 class="page-title">Exams available for you</h1>
      <p id="examStatus" class="exam-status" role="status" aria-live="polite">
        Loading your profile and available exams…
      </p>
      <section id="examList" class="exam-list" aria-label="Available exams"></section>

      <p class="note change-color">
        ⚠ Your countdown timer will start immediately after you click Start. You
        cannot pause or restart the exam once started.
      </p>
    </main>

    <script src="../../backend/studentExamStart.js"></script>
  </body>
</html>
